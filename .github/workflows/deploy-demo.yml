# Typechecks on every push and, on main, redeploys the free static demo to Cloudflare.
# One-time setup: repo Settings -> Secrets and variables -> Actions -> add
#   CLOUDFLARE_API_TOKEN   (an API token limited to "Workers Scripts: Edit")
#   CLOUDFLARE_ACCOUNT_ID
name: deploy-demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:demo
      - name: Deploy to Cloudflare (main only, and only if the secrets are set)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No Cloudflare secrets configured; skipping deploy."; exit 0; fi
          npx wrangler@latest deploy
